[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-omni-neuron"
version = "0.29.0.0.2.0"
description = "vLLM-Omni Neuron backend plugin for diffusion model inference on AWS Trainium/Inferentia"
license = "Apache-2.0"
authors = [
    {name = "AWS Neuron team"}
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dynamic = ["dependencies", "optional-dependencies"]

[project.entry-points."vllm_omni.platform_plugins"]
neuron = "vllm_omni_neuron:neuron_omni_platform_plugin"

[project.entry-points."vllm_omni.general_plugins"]
neuron = "vllm_omni_neuron:register_neuron_pipelines"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/core.txt"]}
optional-dependencies = {test = {file = ["requirements/test.txt"]}}

[tool.setuptools.packages.find]
include = ["vllm_omni_neuron", "vllm_omni_neuron.*"]

[tool.pytest.ini_options]
testpaths = ["test/unit"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = "."
markers = [
    "neuron: requires real Neuron hardware (/dev/neuron* present)",
    "tiny: tiny variant (smaller inputs, fewer layers)",
    "full: full variant (production shapes, all layers)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# NKI kernel source (const-max ring attention, MLP CTE, and NeuroTile) originating in
# KaenaNeuronKernelLibrary — it follows that library's own conventions, so don't apply ours.
# third_party/VBench is a pinned submodule of upstream VBench, vendored verbatim so scores stay
# comparable — linting it would force divergence from the tag we pin. Same reasoning as nkilib.
extend-exclude = ["vllm_omni_neuron/kernels/nkilib", "third_party/VBench"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
lint = ["ruff>=0.9"]
