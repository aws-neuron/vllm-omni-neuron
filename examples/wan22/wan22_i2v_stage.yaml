stage_args:
  - stage_id: 0
    stage_type: diffusion
    final_output: true
    final_output_type: video
    runtime:
      process: true
      devices: "0-63"
      max_batch_size: 2
    engine_args:
      model_class_name: Wan22I2VPipeline
      model_stage: diffusion
      dtype: bfloat16
      boundary_ratio: 0.9
      flow_shift: 5.0
      vae_use_tiling: true
      model_config:
        tp_sequence_parallel: true
      parallel_config:
        tensor_parallel_size: 4
        ring_degree: 8
        cfg_parallel_size: 2
        vae_patch_parallel_size: 16
