stages:
  - stage_id: 0
    max_num_seqs: 2
    runtime:
      devices: "0-63"
    engine_args:
      model_class_name: Wan22Pipeline
      dtype: bfloat16
      boundary_ratio: 0.875
      flow_shift: 5.0
      vae_use_tiling: true
      model_config:
        tp_sequence_parallel: true
      parallel_config:
        tensor_parallel_size: 4
        ring_degree: 8
        cfg_parallel_size: 2
        vae_patch_parallel_size: 16